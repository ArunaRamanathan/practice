<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
    <h1>Please Fill the following details</h1>
    <label for="name">First Name:</label>
    <input type="text" id="name" name="Firstname" required>
    <br>
    <label for="Phoneno">Phone Number:</label>
    <input type="tel" id="Phoneno" name="phoneno">
    <br>
    <label for="dob">DOB:</label>
    <input type="datetime-local" name="DOB" required>
    <br>
    <label for="age">Age:</label>
    <input type="number" name="age" size="1" >
    <br>
    <label for="gender">Gender:</label>
    <select name="gender" id="gender">
        <option value="Male">Male</option>
        <option value="Female">Female</option>
    </select>
    <br>
    <label for="Ppicture">Profile Picture:</label>
    <input type="file" capture="user" accept=".jpg,.jpeg,.png">
    <br>
    <button type="submit">Submit </button>
    <button type="reset">Reset</button>
    </form>
</body>
</html>
